          printf '\ndependencies {\n    implementation "com.google.firebase:firebase-messaging:24.1.0"\n}\n' >> android/app/build.gradle
          cat > $D/MoubarakFcmPlugin.java <<'MKEOF'
          package com.khelcom.moubarak;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.google.firebase.messaging.FirebaseMessaging;

          @CapacitorPlugin(name = "MoubarakFcm")
          public class MoubarakFcmPlugin extends Plugin {
              @PluginMethod
              public void getToken(final PluginCall call) {
                  try {
                      FirebaseMessaging.getInstance().getToken().addOnCompleteListener(t -> {
                          if (t.isSuccessful() && t.getResult() != null) {
                              JSObject r = new JSObject();
                              r.put("token", t.getResult());
                              call.resolve(r);
                          } else {
                              call.reject("token_failed");
                          }
                      });
                  } catch (Exception e) {
                      call.reject("token_failed: " + e.getMessage());
                  }
              }
          }
