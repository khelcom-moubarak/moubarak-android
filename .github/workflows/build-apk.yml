          python3 - <<'PYEOF'
          from PIL import Image, ImageDraw, ImageFont
          import os
          src=Image.open('/tmp/i.png').convert('RGBA')
          col='#%02x%02x%02x'%src.getpixel((4,4))[:3]
          R='android/app/src/main/res'
          for d,l,f in [('mdpi',48,108),('hdpi',72,162),('xhdpi',96,216),('xxhdpi',144,324),('xxxhdpi',192,432)]:
              p=os.path.join(R,'mipmap-'+d)
              os.makedirs(p,exist_ok=True)
              a=src.resize((l,l),Image.LANCZOS)
              a.save(p+'/ic_launcher.png')
