          cat > $D/MoubarakFcmService.java <<'MKEOF'
          package com.khelcom.moubarak;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;

          import androidx.core.app.NotificationCompat;

          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          import java.util.Map;

          public class MoubarakFcmService extends FirebaseMessagingService {
              static final String CH = "mk_calls_v1";

              @Override
              public void onMessageReceived(RemoteMessage m) {
                  try {
                      Map<String, String> d = m.getData();
                      String title = d.get("title");
                      if (title == null || title.isEmpty()) title = "Appel entrant";
                      String body = d.get("body");
                      if (body == null || body.isEmpty()) body = "Touchez pour répondre";

                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      Uri snd = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE);
                      if (Build.VERSION.SDK_INT >= 26) {
                          NotificationChannel c = new NotificationChannel(CH, "Appels", NotificationManager.IMPORTANCE_HIGH);
                          c.setSound(snd, new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build());
                          c.enableVibration(true);
                          c.setVibrationPattern(new long[] { 0, 600, 250, 600, 250, 600, 250, 600 });
                          c.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                          nm.createNotificationChannel(c);
                      }

                      Intent i = new Intent(this, MainActivity.class);
                      i.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      i.putExtra("mk_call", true);
                      int fl = PendingIntent.FLAG_UPDATE_CURRENT;
                      if (Build.VERSION.SDK_INT >= 23) fl |= PendingIntent.FLAG_IMMUTABLE;
                      PendingIntent pi = PendingIntent.getActivity(this, 7, i, fl);

                      NotificationCompat.Builder b = new NotificationCompat.Builder(this, CH)
                          .setSmallIcon(android.R.drawable.sym_call_incoming)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setCategory(NotificationCompat.CATEGORY_CALL)
                          .setPriority(NotificationCompat.PRIORITY_MAX)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                          .setAutoCancel(true)
                          .setTimeoutAfter(60000)
                          .setSound(snd)
                          .setVibrate(new long[] { 0, 600, 250, 600, 250, 600, 250, 600 })
                          .setContentIntent(pi)
                          .setFullScreenIntent(pi, true);
                      nm.notify(7001, b.build());
                  } catch (Exception e) {
                      // on ne plante jamais pendant un appel
                  }
              }
          }
          MKEOF
          cat > $D/MainActivity.java <<'MKEOF'
          package com.khelcom.moubarak;

          import android.Manifest;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;

          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.activity.OnBackPressedCallback;
          import android.webkit.WebView;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(MoubarakStoragePlugin.class);
              registerPlugin(MoubarakFcmPlugin.class);
              super.onCreate(savedInstanceState);
              mkWake(getIntent());
              mkAsk();
              getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                @Override
                public void handleOnBackPressed() {
                  try {
                    WebView w = getBridge().getWebView();
                    if (w != null && w.canGoBack()) {
                      w.goBack();
                      return;
                    }
                  } catch (Exception e) {
                  }
                  moveTaskToBack(true);
                }
              });
            }

            @Override
            protected void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              mkWake(intent);
            }

            private void mkWake(Intent in) {
              try {
                if (in != null && in.getBooleanExtra("mk_call", false) && Build.VERSION.SDK_INT >= 27) {
                  setShowWhenLocked(true);
                  setTurnScreenOn(true);
                }
              } catch (Exception e) {
              }
            }

            private void mkAsk() {
              try {
                if (Build.VERSION.SDK_INT >= 33
                    && ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                  ActivityCompat.requestPermissions(this, new String[] { Manifest.permission.POST_NOTIFICATIONS }, 71);
                  return;
                }
                if (Build.VERSION.SDK_INT >= 34) {
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  SharedPreferences sp = getSharedPreferences("mk", MODE_PRIVATE);
                  if (!nm.canUseFullScreenIntent() && !sp.getBoolean("fsi", false)) {
                    sp.edit().putBoolean("fsi", true).apply();
                    Intent s = new Intent(Settings.ACTION_MANAGE_APP_USE_FULL_SCREEN_INTENT, Uri.parse("package:" + getPackageName()));
                    startActivity(s);
                  }
                }
              } catch (Exception e) {
              }
            }
          }
