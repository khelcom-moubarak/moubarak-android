# Fabrique l'application Android MOUBARAK (APK) automatiquement.
# L'APK apparait dans l'onglet « Releases » a la fin du build.
name: Build Moubarak APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Écrire les fichiers du projet
        run: |
          cat > package.json <<'MKEOF'
          {
            "name": "moubarak-android",
            "private": true,
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/core": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/assets": "^3.0.5",
              "@capacitor/cli": "^7.0.0"
            }
          }
          MKEOF
          cat > capacitor.config.json <<'MKEOF'
          {
            "appId": "com.khelcom.moubarak",
            "appName": "Moubarak",
            "webDir": "www",
            "server": {
              "url": "https://moubarak-khelcom.netlify.app",
              "cleartext": false
            }
          }
          MKEOF
          mkdir -p www native
          cat > www/index.html <<'MKEOF'
          <!doctype html><html><head><meta charset="utf-8"><title>Moubarak</title></head><body>Moubarak</body></html>
          MKEOF
          cat > native/MoubarakStoragePlugin.java <<'MKEOF'
          package com.khelcom.moubarak;

          import android.Manifest;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.media.MediaScannerConnection;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.util.HashMap;
          import java.util.Map;
          import java.util.UUID;

          @CapacitorPlugin(
              name = "MoubarakStorage",
              permissions = {
                  @Permission(alias = "storage", strings = { Manifest.permission.WRITE_EXTERNAL_STORAGE })
              }
          )
          public class MoubarakStoragePlugin extends Plugin {

              private static class Sink {
                  OutputStream os;
                  Uri uri;
                  File file;
                  String kind;
              }

              private final Map<String, Sink> sinks = new HashMap<>();

              private static final String DIR_IMAGES = "Moubarak Images";
              private static final String DIR_VIDEOS = "Moubarak Videos";
              private static final String DIR_FILES = "Moubarak";

              @PluginMethod
              public void begin(PluginCall call) {
                  if (Build.VERSION.SDK_INT < 29 && getPermissionState("storage") != PermissionState.GRANTED) {
                      requestPermissionForAlias("storage", call, "storagePerm");
                      return;
                  }
                  doBegin(call);
              }

              @PermissionCallback
              private void storagePerm(PluginCall call) {
                  if (getPermissionState("storage") == PermissionState.GRANTED) {
                      doBegin(call);
                  } else {
                      call.reject("storage_permission_denied");
                  }
              }

              private static String safe(String n) {
                  if (n == null || n.trim().isEmpty()) n = "Moubarak_fichier";
                  return n.replaceAll("[\\\\/:*?\"<>|]", "_");
              }

              private static String mimeFor(String kind, String mime) {
                  if (mime == null) mime = "";
                  if ("image".equals(kind)) return mime.startsWith("image/") ? mime : "image/jpeg";
                  if ("video".equals(kind)) return mime.startsWith("video/") ? mime : "video/mp4";
                  if (mime.isEmpty() || mime.startsWith("audio/") || mime.startsWith("video/") || mime.startsWith("image/")) {
                      return "application/octet-stream";
                  }
                  return mime;
              }

              private void doBegin(PluginCall call) {
                  try {
                      String name = safe(call.getString("name", "Moubarak_fichier"));
                      String mime = call.getString("mime", "application/octet-stream");
                      String kind = call.getString("kind", "file");
                      boolean image = "image".equals(kind);
                      boolean video = "video".equals(kind);

                      Sink s = new Sink();
                      s.kind = kind;
                      ContentResolver cr = getContext().getContentResolver();

                      if (Build.VERSION.SDK_INT >= 29) {
                          ContentValues v = new ContentValues();
                          v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                          v.put(MediaStore.MediaColumns.MIME_TYPE, mimeFor(kind, mime));
                          Uri coll;
                          if (image) {
                              coll = MediaStore.Images.Media.EXTERNAL_CONTENT_URI;
                              v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/" + DIR_IMAGES);
                          } else if (video) {
                              coll = MediaStore.Video.Media.EXTERNAL_CONTENT_URI;
                              v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_MOVIES + "/" + DIR_VIDEOS);
                          } else {
                              coll = MediaStore.Files.getContentUri("external");
                              v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOCUMENTS + "/" + DIR_FILES);
                          }
                          v.put(MediaStore.MediaColumns.IS_PENDING, 1);
                          Uri uri = cr.insert(coll, v);
                          if (uri == null) {
                              call.reject("insert_failed");
                              return;
                          }
                          s.uri = uri;
                          s.os = cr.openOutputStream(uri);
                      } else {
                          File root = Environment.getExternalStoragePublicDirectory(
                              image ? Environment.DIRECTORY_PICTURES : (video ? Environment.DIRECTORY_MOVIES : Environment.DIRECTORY_DOCUMENTS)
                          );
                          File dir = new File(root, image ? DIR_IMAGES : (video ? DIR_VIDEOS : DIR_FILES));
                          dir.mkdirs();
                          File f = new File(dir, name);
                          if (f.exists()) {
                              int dot = name.lastIndexOf('.');
                              String base = dot > 0 ? name.substring(0, dot) : name;
                              String ext = dot > 0 ? name.substring(dot) : "";
                              f = new File(dir, base + "_" + System.currentTimeMillis() + ext);
                          }
                          s.file = f;
                          s.os = new FileOutputStream(f);
                      }

                      if (s.os == null) {
                          call.reject("open_failed");
                          return;
                      }
                      String token = UUID.randomUUID().toString();
                      sinks.put(token, s);
                      JSObject r = new JSObject();
                      r.put("token", token);
                      call.resolve(r);
                  } catch (Exception e) {
                      call.reject("begin_failed: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void chunk(PluginCall call) {
                  String token = call.getString("token");
                  Sink s = token == null ? null : sinks.get(token);
                  if (s == null) {
                      call.reject("no_token");
                      return;
                  }
                  try {
                      byte[] b = Base64.decode(call.getString("data", ""), Base64.DEFAULT);
                      s.os.write(b);
                      call.resolve();
                  } catch (Exception e) {
                      discard(token);
                      call.reject("chunk_failed: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void end(PluginCall call) {
                  String token = call.getString("token");
                  Sink s = token == null ? null : sinks.remove(token);
                  if (s == null) {
                      call.reject("no_token");
                      return;
                  }
                  try {
                      s.os.flush();
                      s.os.close();
                      if (s.uri != null) {
                          ContentValues v = new ContentValues();
                          v.put(MediaStore.MediaColumns.IS_PENDING, 0);
                          getContext().getContentResolver().update(s.uri, v, null, null);
                      } else if (s.file != null) {
                          MediaScannerConnection.scanFile(getContext(), new String[] { s.file.getAbsolutePath() }, null, null);
                      }
                      String where = "image".equals(s.kind) ? "Pictures/" + DIR_IMAGES
                          : ("video".equals(s.kind) ? "Movies/" + DIR_VIDEOS : "Documents/" + DIR_FILES);
                      JSObject r = new JSObject();
                      r.put("where", where);
                      call.resolve(r);
                  } catch (Exception e) {
                      call.reject("end_failed: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void abort(PluginCall call) {
                  discard(call.getString("token"));
                  call.resolve();
              }

              private void discard(String token) {
                  if (token == null) return;
                  Sink s = sinks.remove(token);
                  if (s == null) return;
                  try { s.os.close(); } catch (Exception ignored) {}
                  try {
                      if (s.uri != null) getContext().getContentResolver().delete(s.uri, null, null);
                      else if (s.file != null) s.file.delete();
                  } catch (Exception ignored) {}
              }
          }
          MKEOF

      - name: Installer Capacitor
        run: npm install --no-audit --no-fund

      - name: Ajouter Android et le plugin
        run: |
          npx cap add android
          D=android/app/src/main/java/com/khelcom/moubarak
          mkdir -p $D
          cp native/MoubarakStoragePlugin.java $D/
          cat > $D/MainActivity.java <<'MKEOF'
          package com.khelcom.moubarak;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(MoubarakStoragePlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          MKEOF
          sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Logo M de l'application
        run: |
          curl -fsSL https://moubarak-khelcom.netlify.app/icon-maskable-512.png -o /tmp/i.png || curl -fsSL https://moubarak-khelcom.netlify.app/icon-512.png -o /tmp/i.png
          pip install pillow
          python3 - <<'PYEOF'
          from PIL import Image
          import os
          src=Image.open('/tmp/i.png').convert('RGBA')
          col='#%02x%02x%02x'%src.getpixel((4,4))[:3]
          R='android/app/src/main/res'
          for d,l,f in [('mdpi',48,108),('hdpi',72,162),('xhdpi',96,216),('xxhdpi',144,324),('xxxhdpi',192,432)]:
              p=os.path.join(R,'mipmap-'+d)
              os.makedirs(p,exist_ok=True)
              a=src.resize((l,l),Image.LANCZOS)
              a.save(p+'/ic_launcher.png')
              a.save(p+'/ic_launcher_round.png')
              c=Image.new('RGBA',(f,f),(0,0,0,0))
              k=int(f*0.78)
              c.paste(src.resize((k,k),Image.LANCZOS),((f-k)//2,(f-k)//2))
              c.save(p+'/ic_launcher_foreground.png')
          v=os.path.join(R,'values')
          os.makedirs(v,exist_ok=True)
          open(v+'/ic_launcher_background.xml','w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">'+col+'</color>\n</resources>\n')
          print('logo ok',col)
          PYEOF

      - name: Fabriquer l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Moubarak APK ${{ github.run_number }}
          files: android/**/*.apk￼Enter
